
name: Talha Music APK Build

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract project
        run: |
          unzip -q Talha-Music-Android-Project.zip -d source
          cd source/Echo-Music-main
          chmod +x gradlew

      - name: Install Android NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;28.2.13676358"

      - name: Build APK
        run: |
          cd source/Echo-Music-main
          ./gradlew assembleUniversalFossDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Talha-Universal-APK
          path: source/Echo-Music-main/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
