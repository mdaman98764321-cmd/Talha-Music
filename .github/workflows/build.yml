name: Build FARDIN APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova Project
        run: |
          rm -rf fardin_app
          cordova create fardin_app com.fardin.music "FARDIN"
          cd fardin_app
          cordova platform add android
          cd ..
          # বর্তমান ফোল্ডার থেকে ফাইলগুলো কপি করে কর্ডোভা www ফোল্ডারে পাঠানো
          rm -rf fardin_app/www/*
          cp -r index.html fardin_app/www/ || true
          cp -r css fardin_app/www/ || true
          cp -r js fardin_app/www/ || true

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Android APK
        run: |
          cd fardin_app
          cordova build android

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FARDIN-APK
          path: fardin_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
