name: Build FARDIN APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-style: 18

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova Project
        run: |
          cordova create fardin_app com.fardin.music "FARDIN"
          cp -r index.html css js fardin_app/www/
          cd fardin_app
          cordova platform add android

      - name: Setup Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Android APK
        run: |
          cd fardin_app
          cordova build android

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v3
        with:
          name: FARDIN-APK
          path: fardin_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
